<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7d8b9c" />
    <title>Pet Trails</title>
  </head>
  <body>
    <div id="ui">
      <div id="vignette"></div>
      <div id="chip" class="chip wait" title="Connecting"></div>
      <section id="title" class="title-screen">
        <h1 class="logo">PET<br />TRAILS</h1>
        <div class="title-gap"></div>
        <div class="title-panel">
          <label class="name-field">
            <span>Name</span>
            <input id="name" maxlength="16" value="You" autocomplete="nickname" enterkeyhint="done" />
          </label>
          <button id="play" class="btn" type="button" disabled>PLAY</button>
          <div class="soon-row">
            <button id="open-pets" class="btn secondary" type="button">Pets</button>
            <button id="open-boxes" class="btn secondary" type="button">Boxes</button>
          </div>
          <p id="petline" class="petline">Loading pets…</p>
            <div id="petcard" class="petcard">
            <p id="petcard-reward" class="petcard-reward" hidden></p>
            <div id="petcard-name">Your pet</div>
            <div id="petcard-boost">Abilities +0%</div>
            <div class="bar"><i id="petcard-fill"></i></div>
            <div id="petcard-unlocks" class="chips"></div>
          </div>
        </div>
      </section>
      <div id="hud" hidden>
        <div id="lb" class="lb"></div>
        <div id="you" class="you">
          <div id="you-pct">0.0%</div>
          <div id="you-meta">
            <span id="you-kills">0</span>
            <span id="you-train">0</span>
            <span id="you-left">10 left</span>
          </div>
        </div>
        <div id="steer" class="steer">Drag up to go up</div>
        <button id="ability" class="ability" type="button" aria-label="Ability">
          <svg class="cd" viewBox="0 0 100 100" aria-hidden="true">
            <circle id="ability-ring" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="ability-icon">⚡</span>
        </button>
      </div>
      <div id="stick" hidden><div id="stick-knob"></div></div>
      <div id="kill-banner" class="kill-banner"><b>KILL</b><span id="kill-name"></span></div>
      <div id="win" class="win" hidden><b id="win-title">You conquered the map!</b></div>
      <div id="out" class="out" hidden>Out - 4th of 10</div>
      <div id="dim" hidden></div>
      <section id="death" class="sheet" hidden>
        <div id="levelup" class="levelup" hidden>
          <b>Level up!</b>
          <span id="levelup-detail"></span>
        </div>
        <div id="death-icon" class="death-icon">✂</div>
        <p id="death-kicker" class="eyebrow">Run over</p>
        <h2 id="death-title">Your trail was cut!</h2>
        <ul id="death-stats" class="stats"></ul>
        <button id="again" class="btn" type="button">PLAY AGAIN</button>
      </section>
      <div id="toasts"></div>
      <div id="popups"></div>
      <div id="labels"></div>
      <div id="perf" hidden></div>
      <section id="pets" class="meta" hidden>
        <div class="meta-bar">
          <button id="pets-back" class="btn secondary slim" type="button">Back</button>
          <h2>Pets</h2>
        </div>
        <div id="pet-grid" class="pet-grid"></div>
        <div id="pet-detail" class="pet-detail" hidden>
          <div class="turntable"></div>
          <div id="pet-sheet" class="pet-sheet"></div>
        </div>
      </section>
      <section id="boxes" class="meta" hidden>
        <div class="meta-bar">
          <button id="boxes-back" class="btn secondary slim" type="button">Back</button>
          <h2>Boxes</h2>
        </div>
        <div class="box-panel">
          <p id="box-coins" class="box-coins">0 coins</p>
          <p class="box-copy">A mystery box rolls a pet, a rarity, and a fresh kit.</p>
          <button id="box-buy" class="btn" type="button">Buy</button>
          <button id="box-open" class="btn secondary" type="button">Open</button>
        </div>
      </section>
      <div id="reveal" class="reveal" hidden>
        <div id="reveal-flash"></div>
        <div id="reveal-box" class="gift"></div>
        <article id="reveal-card" class="reveal-card" hidden></article>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
